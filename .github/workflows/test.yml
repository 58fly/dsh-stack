name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    name: ds-loop guard checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run the dependency-free unit checks
        run: node test/ds-loop.test.mjs
