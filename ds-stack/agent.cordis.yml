# DeepSeek Stack (ds-stack) — an agent preset that ports
# https://github.com/aicodeking/deepseek-stack into DSH.
#
# The upstream project is a skill pack, not a harness: SKILL.md files that make
# cheap models work like expensive ones (restate, read first, smallest verified
# step, evidence before "done", a hard stop after repeating a failed idea).
# DSH already renders skills through `dsh-tool-skill` / `dsh-skill-filesystem`,
# so this composition supplies the two things the pack cannot supply by itself:
#
#   1. an always-on identity — `ds-mode` distilled into the persona, because a
#      working style that must be loaded by a tool call on every session is not
#      "always-on";
#   2. a harness-level loop guard — `ds-loop.mjs`, which turns the pack's two
#      strongest rules into turn boundaries the model cannot quietly skip
#      (verify after editing, stop after two consecutive failures).
#
# The remaining rows mirror the shipped `standard` preset row for row, so the
# tool catalog, sandbox, approvals, compaction and delegation behavior stay
# exactly what a Standard session gets. Read the comments below before editing:
# each one records a host/agent plane constraint, not a preference.

# ── identity ────────────────────────────────────────────────────────────────

# `prefix` replaces the deployment persona for agents on this preset only; the
# suffix keeps the standard working-directory line. `complete` stays false on
# purpose: the pack is about HOW the agent works, not about shrinking the tool
# guidance, runtime context, or approval/sandbox notices that keep it safe.
# `{{model}}` and `{{cwd}}` are prompt variables resolved at render time.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      You are a coding agent powered by the {{model}} model, running the DeepSeek Stack: a tight, evidence-first loop for long autonomous work.

      Every task follows the same order:
      1. Restate the task in one line and name the smallest change that satisfies it. Start reversible work without asking.
      2. Read the code you will touch — and every caller of a function whose behavior you change — before editing it. Read the range you need, not the whole file.
      3. Make the smallest diff that solves the problem. Delete before you add. No options, helpers, or layers nothing needs yet.
      4. After each change, run one real command that proves it: the test, the build, the script, or the program itself.
      5. Report with evidence: the goal in one line, files changed with their paths, the checks you ran and what they returned, then open issues. Keep it short.

      Rules that hold everywhere:
      - Fix the root cause, not the symptom.
      - One change at a time. For work with more than two steps, keep a short numbered plan in the todo list.
      - If the same fix fails twice, stop. Name the premise the failed attempts share, test that premise directly, then change the approach.
      - Never claim a result you did not measure. Label each claim measured, inferred, or guessed, and say plainly when a check failed or was skipped.
      - Pause before irreversible actions: force pushes, deploys, data deletion, messages to other people.
      - Keep context lean: summarize, trim long output to the lines that matter, send bulk reading and wide searches to subagents, and do not reread a file you just edited.
      - Comments explain why, never what the next line does.

      This session ships the ds-* loop skills (ds-plan-loop, ds-verify-loop, ds-review-loop, ds-unstick, ds-tdd, ds-ship, ds-ledger, ds-unslop, ds-principles, and others). When a task clearly matches one, or the user names one, call the `skill` tool with its exact name before acting.

      Harness rule: ending a turn right after editing files with no successful check afterwards sends you back to verify. Run the check, or state in one line why it cannot run here.
    suffix: Your working directory is {{cwd}}.

# Workspace instruction files stay injected: they are the repository's own
# rules and the pack assumes the agent knows them before it plans.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── the loop guard ──────────────────────────────────────────────────────────

# Two of the pack's rules are checks rather than prose: "verify after every
# change" and "stop after two failures of the same idea". They run on
# `agent/turn-stopping` — the serial hook that fires before an otherwise
# finished turn closes — and steer one short message back into the session so
# the turn keeps going. At most one steer per turn, so the guard can never turn
# into a loop of its own. See ds-loop.mjs for the evidence it reads.
- id: ds-loop
  name: ./ds-loop.mjs
  config:
    evidence: true
    unstick: true
    failStreak: 2
    maxSteersPerTurn: 1
    includeSubagents: true
    mutationTools: [write, edit, str_replace_editor, apply_patch, multiedit, notebook_edit]
    checkTools: [bash, pwsh, sh, shell]
    documentationSuffixes: ['.md', '.mdx', '.txt', '.rst', '.adoc']

# ── shell ───────────────────────────────────────────────────────────────────

# Same pair as the standard preset: the platform-appropriate sandboxed shell
# registers the model-facing tool, and the host owns the executor.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY is host-plane and layered per scope, so these rows need no
# realm: they register into this preset's layer of it.
#
# `customSkillDirs` (rank 300) points at the pack shipped beside this file. It
# is additive: project roots (100/200) still win, the user's own roots (400/500)
# still load, and the deployment's bundled root is left alone — unlike
# `bundledSkillDir`, which would REPLACE the deployment default. The path is
# derived from this composition's own baseUrl, so moving or reinstalling the
# bundle cannot break it; a missing directory throws at mount instead of
# silently presenting an empty catalog.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs: !!js >-
      (() => {
        const { fileURLToPath } = process.getBuiltinModule('node:url')
        const fs = process.getBuiltinModule('node:fs')
        const dir = fileURLToPath(new URL('./skills', ctx.baseUrl))
        if (!fs.existsSync(dir)) throw new Error(`ds-stack: bundled skills directory not found: ${dir}`)
        return [dir]
      })()

# The catalog is the pack's entry point, so `tool-skill` stays mounted and each
# summary is capped. The cap is 400 because the pack's own routing signal — the
# "Use when …" clause — sits at the END of its descriptions (longest is 349
# chars); a tighter cap would truncate exactly the sentence that tells the model
# when to load the skill. The whole catalog is ~6.8k chars (~1.7k tokens) of
# durable prefix: lower this cap if that cost matters more than routing.
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  config:
    catalogDescriptionMaxLength: 400

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool; the goal SERVICE and its driver are host-plane.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent, so an entry-local realm is its correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
          You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

          Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

          The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

          Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

          Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

          When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# shares this realm. `tokenMeter` stays host-plane: its projection units are
# process-wide, so a preset must not own them.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    # The pack tells the model to keep summaries, not raw output; this pruner
    # enforces the same rule on oversized tool results.
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends are host-plane
# singletons; this preset contributes the delegation TOOLS that resolve them.
# `workflows` has no reader outside an agent, so every row touching it shares
# one entry-local realm here.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      disabled: true
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# The pack's "short numbered plan" lives here.
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its providers stay host-plane; only the tool is
# per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'

# Host-plane management tools are never part of an agent's catalog by default.
- id: tool-plugin-manager
  name: '@deepseek-ai/dsh-plugin-manager/tools'
  disabled: true
